name: QEdge branch policy

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Reject custom changes to main
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [ "$BASE_BRANCH" != dev ]; then
            echo "QEdge changes must target dev. main has a separate sync or release role."
            exit 1
          fi
      - name: Check out the feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 128
          persist-credentials: false
      - name: Require the current dev base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          case "$HEAD_BRANCH" in
            main|dev) echo "Use a dedicated branch created from dev."; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "$BASE_SHA" HEAD; then
            echo "The feature branch must contain current dev. Merge dev into the branch and retry."
            exit 1
          fi
